[project]
name = "vdl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Enko", email = "ruslanpenta@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "m3u8>=6.0.0",
    "textual>=8.2.8",
]

[project.scripts]
vdl = "vdl:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
